name: Force Automation Run

on:
  workflow_dispatch:

jobs:
  force-run:
    runs-on: ubuntu-latest
    name: Force kivv automation run

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.1.38'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set runtime cron secret and force run
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          force_secret="$(openssl rand -hex 32)"

          cd automation
          printf '%s' "$force_secret" | bunx wrangler secret put CRON_SECRET

          curl --fail --show-error --silent \
            --request POST \
            --header "Authorization: Bearer ${force_secret}" \
            "https://kivv-automation.jeffbarron.workers.dev/run?force=true"
